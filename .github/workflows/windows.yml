name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 · Node 22
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          architecture: x64
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Prepare FFmpeg and ffprobe
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed: $LASTEXITCODE" }
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg is unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe is unavailable' }

      - name: Prepare Remotion render browser
        run: npx --no-install remotion browser ensure

      - name: Verify production server and real MP4 export
        run: npm run test:ci

      - name: Upload render proof and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-render-proof
          path: .frame-motion/verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
